name: Sync site from BezReszty
# The site's source of truth is website/ in PomagaSie/BezReszty. This workflow mirrors it here
# and rebuilds GitHub Pages. BezReszty triggers it on every push to main that touches website/
# (repository_dispatch); the schedule is a fallback in case that trigger is not configured.
on:
  repository_dispatch:
    types: [bezreszty-website]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sync-site
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: PomagaSie/BezReszty
          ref: main
          path: .source
          sparse-checkout: website
      - name: Mirror website/ into the site root
        id: mirror
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .source -exec rm -rf {} +
          cp -R .source/website/. ./
          touch .nojekyll
          # Version CSS/JS by content so browsers never pair new HTML with a cached old stylesheet
          v=$(cat style.css script.js | sha256sum | cut -c1-10)
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|; s|src=\"script.js\"|src=\"script.js?v=$v\"|" index.html
          rm -rf .source
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit and rebuild Pages
        if: steps.mirror.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c user.name="Michał Mleczko" -c user.email="do@mleczki.pl" commit -m "Sync site from PomagaSie/BezReszty website/"
          git push
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "::notice::Pages rebuild request not accepted; the push itself triggers the build."
